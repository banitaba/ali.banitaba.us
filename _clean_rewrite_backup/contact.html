<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ali Banitaba - Contact</title>
  <meta name="description" content="Contact Ali Banitaba.">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <img src="images/logo.png" alt="Ali Banitaba">
        <span>Ali Banitaba</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="about.html" data-nav="about">About</a>
        <a href="work.html" data-nav="work">Works</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Contact</h1>
    <section class="contact-grid">
      <div>
        <p class="lead">Whether you would like to discuss a project, collaboration, or simply say hello, I would be happy to connect.</p>
        <div class="contact-links">
          <a href="mailto:ab.banitaba@gmail.com">ab.banitaba@gmail.com</a>
          <a href="https://www.linkedin.com/in/ali-banitabadesigner/">LinkedIn</a>
          <a href="https://www.instagram.com/arcitography?igsh=eWwybDlkbXhwYWJr&utm_source=qr">Instagram</a>
          <span>Based in Los Angeles, California</span>
        </div>
      </div>

      <form class="contact-form" data-contact-form>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Open Email Draft</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-wrap">
      <span>&copy; <span data-year></span> Ali Banitaba</span>
      <a href="mailto:ab.banitaba@gmail.com">ab.banitaba@gmail.com</a>
    </div>
  </footer>

  <script src="js/site-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
